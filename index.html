<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- BẮT BUỘC cho điện thoại: không có thẻ này, trình duyệt mobile sẽ
         render trang theo khổ desktop 980px rồi co nhỏ lại -> chữ bé tí,
         phải zoom mới đọc được. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8590c" />
    <meta name="description" content="Đặt món ăn sáng nhanh — xem thực đơn, chọn món, bếp nhận đơn ngay." />

    <!-- PWA: cho phép cài app lên màn hình chính điện thoại.
         Nhờ vậy mở app giống app thật, đồng thời iOS mới cho phép hiện
         thông báo đơn mới khi app chạy nền. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Quán Ăn Sáng" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Quán Ăn Sáng — Đặt món</title>
    <script type="module" crossorigin src="./assets/index-BKjYath6.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-OsqSIBDb.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Khu vực duy nhất được in ra giấy (máy in nhiệt 80mm) -->
    <div id="print-area"></div>
    <!-- Khu vực in mã QR khách quen.
         Nằm ở cấp <body> (không phải trong modal) vì CSS in dùng
         `body > *:not(#qr-print-area) { display:none }` để ẩn giao diện —
         nếu ảnh QR nằm sâu trong modal thì nó cũng bị ẩn theo. -->
    <div id="qr-print-area"></div>
  </body>
</html>
